# Toolchain and tasks for a shared laenen-ai module.
#
# Derived from cas/mise.toml but deliberately NOT a copy: cas's migrate, dev,
# up, down, reset, db and observability tasks reference ./cmd/casd and
# deploy/compose/, neither of which exists in a library module, and its
# `generate` task runs sqlc and buf against nothing. A task list with dangling
# entries trains people to ignore task lists.
#
# A module that later grows migrations or generated code adds the task it
# actually needs, with the same name and meaning cas uses.

[tools]
go            = "1.27.3"
golangci-lint = "2.15.0"
sqlc          = "1.30.0"
gofumpt       = "0.12.0"

[env]
CGO_ENABLED = "0"

[tasks.fmt]
run = "gofumpt -l -w $(find . -path ./.claude -prune -o -name '*.go' -print)"

[tasks.fmt-check]
run = "test -z \"$(gofumpt -l $(find . -path ./.claude -prune -o -name '*.go' -print))\""

[tasks.lint]
run = "golangci-lint run"

[tasks.test]
description = "Inner loop: no containers, no databases. Skips at run time, never behind a build tag."
# -count=1 is not optional. `go test` caches a package's result and will serve
# it again for an unchanged package — which on 2026-10-23 let a rewritten
# cryptographic domain tag in `audit` pass local verification, because the
# package whose test would have caught it had not changed in a way the cache
# noticed. A gate that can serve a stale pass is not a gate.
run = "go test ./... -short -count=1"

[tasks.build]
description = "Proves the shipped binary is cgo-free: inherits CGO_ENABLED=0 from [env]."
run = "go build ./..."

[tasks.test-all]
description = "Full suite: race detector over the published root module."
# CGO_ENABLED=0 is a *release* constraint (cgo-free, cross-compilable binary),
# not a test constraint. The race detector needs cgo, and race detection is
# worth more in tests than cgo-freedom is; the cgo-free property is verified by
# the `build` task, which `check` also depends on.
#
# The nested module under docs/superpowers/spikes is a throwaway spike, not a
# published module; it is deliberately not part of this release-facing suite.
env = { CGO_ENABLED = "1" }
# -count=1 for the reason given on the `test` task.
run = "go test ./... -race -count=1"

[tasks.vectors-check]
description = "Fail if the committed wire-format vectors are not reproducible."
# The vectors are a published artifact. Regenerating them and diffing is the
# same reviewable-diff discipline the old api.txt gate used, without pretending
# the Go API is a golden file.
run = "go test ./chain -run TestVectors -update-vectors -count=1 && git diff --exit-code -- chain/testdata/vectors.json"

[tasks.generate-check]
description = "Verify this library has no generated code; fail if a generator appears without a real check."
# TRAP: do not copy `sqlc diff` into a repo with no sqlc.yaml. It fails on a
# repository that has nothing to generate, which trains people to ignore the
# task. This guard genuinely verifies "nothing to generate": it fails the
# moment a generator config or a go:generate directive appears, forcing the
# author to add a real generation/diff task instead of silently passing.
run = '''
if [ -e sqlc.yaml ] || [ -e buf.gen.yaml ]; then
  echo "generate-check: a generator configuration exists; wire a real generation/diff task" >&2
  exit 1
fi
if grep -Rqs --include='*.go' --exclude-dir=.git --exclude-dir=docs '^//go:generate' .; then
  echo "generate-check: a go:generate directive exists; wire a real generation/diff task" >&2
  exit 1
fi
echo "generate-check: no generators configured"
'''

[tasks.tidy-check]
description = "Fail if go.mod/go.sum are not tidy."
run = "go mod tidy -diff"

[tasks.vuln]
description = "Report reachable Go vulnerabilities."
run = "go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 ./..."

[tasks.api-diff]
description = "Compare the importable API with the last root tag using apidiff."
run = "bash scripts/api-diff.sh"

[tasks.release-check]
description = "Validate a clean release tree with gorelease (run from a clean checkout)."
run = "go run golang.org/x/exp/cmd/gorelease@v0.0.0-20261014143641-f0251eb4aa3e -base=latest"

[tasks.check]
depends = ["fmt-check", "tidy-check", "lint", "build", "test-all", "generate-check", "vuln", "api-diff", "vectors-check"]

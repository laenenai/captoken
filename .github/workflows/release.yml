name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          fetch-depth: 0

      - uses: jdx/mise-action@c37c93293d6b742fc901e1406b8f764f6fb19dac # v2.4.4
        with:
          install: true
          cache: true

      # A tag is not a release until the same gate as main has passed on it.
      - name: check
        run: mise run check

      # gorelease requires a clean tree and compares against the published
      # latest version. It is deliberately not in the dirty-branch gate.
      # captoken is pre-1.0, so incompatible changes are reported but do not
      # fail this step; they must be recorded in CHANGELOG.md/UPGRADING.md.
      - name: gorelease
        # Compare against the previous signed tag, not "latest": the proxy
        # may already see the tag being released, and gorelease rejects a
        # base that is not lower than the proposed version.
        run: bash scripts/release-check.sh -version="${GITHUB_REF_NAME}"

      - name: create GitHub release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          body_path: CHANGELOG.md
          generate_release_notes: false
          draft: false
          prerelease: false

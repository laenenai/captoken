name: ci

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "0 5 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      # fetch-depth: 0 is required: api-diff finds the previous root tag with
      # git describe and archives it for comparison.
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          fetch-depth: 0

      # mise.toml is the single source of tool versions. CI does not pin Go,
      # gofumpt or golangci-lint a second time in this file.
      - uses: jdx/mise-action@c37c93293d6b742fc901e1406b8f764f6fb19dac # v2.4.4
        with:
          install: true
          cache: true

      - name: check
        # api-diff reports pre-1.0 incompatible changes but does not fail on
        # them. Set API_DIFF_STRICT=1 after 1.0.
        run: mise run check

      - name: minimum supported Go
        # go.mod declares the minimum; this runs the short suite under that
        # exact toolchain rather than whatever mise's current pin installs.
        run: |
          mise install go@1.27.3
          mise exec go@1.27.3 -- env GOTOOLCHAIN=local go test ./... -short -count=1

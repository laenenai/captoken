version: "2"

linters:
  enable:
    - errcheck
    - govet
    - staticcheck
    - revive
    - gosec
    - bodyclose
    - rowserrcheck
    - sqlclosecheck
    - contextcheck
    - errorlint
    - noctx
    - gocritic
    - forbidigo
  settings:
    forbidigo:
      forbid:
        - pattern: '^fmt\.Print.*$'
          msg: "use structured logging instead of fmt.Print*"
        - pattern: '^panic$'
          msg: "panic is forbidden outside main; return a typed error instead"
  exclusions:
    rules:
      # panic is allowed only in the main package itself: files directly
      # inside cmd/<binary>/ (not any subpackage nested under it). fmt.Print*
      # stays forbidden everywhere, including main, so this rule is scoped to
      # the panic-specific forbidigo message only.
      - path: '^cmd/[^/]+/[^/]+\.go$'
        linters:
          - forbidigo
        text: '`panic` forbidden'
